name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DON_OMAR_RADIO_PLAYER_v2.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o DON_OMAR_RADIO_PLAYER_v2.zip -d .
          test -d DON_OMAR_RADIO_PLAYER/app

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: DON_OMAR_RADIO_PLAYER
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: don-omar-radio-player-debug
          path: DON_OMAR_RADIO_PLAYER/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
